<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Ghost-Em</title>
    {% if turnstile_site_key %}
      <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    {% endif %}
    <style>
      body { color-scheme: dark; background: #130d20; color: #f4eaff; font: 1rem system-ui; padding: 2rem 1rem; }
      main { max-width: 24rem; margin: min(6vh, 48px) auto; }
      .logo-splash { width: 88px; height: 88px; margin: 0 auto 16px; position: relative;
        display: grid; place-items: center; isolation: isolate; }
      .logo-splash svg { width: 58px; height: 58px; color: #c7a6ff; animation: appear .45s ease-out both; }
      .signal-ring { position: absolute; inset: 10px; border: 1px solid #ff6666; border-radius: 50%;
        z-index: -1; opacity: 0; animation: signal 1.1s ease-out both; }
      .signal-ring:nth-child(2) { animation-delay: .16s; }
      @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
      @keyframes signal { 0% { opacity: 0; transform: scale(.64); } 24% { opacity: .68; } 100% { opacity: 0; transform: scale(1.45); } }
      @media (prefers-reduced-motion: reduce) {
        .logo-splash svg { animation: none; }
        .signal-ring { animation: none; }
      }
      label, input { display: block; }
      input:not([type=hidden]) { box-sizing: border-box; width: 100%; padding: .55rem; }
      button { padding: .6rem 1rem; background: #6d28d9; color: white; border: 0; border-radius: .3rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo-splash" aria-hidden="true">
        <span class="signal-ring"></span><span class="signal-ring"></span>
        <svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 53V32a20 20 0 0 1 40 0v21l-7-5-6 5-7-5-7 5-6-5z" stroke="currentColor" stroke-width="2.5"/>
          <path d="M23 34a13 13 0 0 1 18 0m-14 5a7 7 0 0 1 10 0m-5 5h.01" stroke="#ff7070" stroke-width="2.5"/>
        </svg>
      </div>
      <h1>Sign in to Ghost-Em</h1>
      <p>Access is limited to accounts created by an administrator.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        {% if turnstile_site_key %}
          <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-action="login"></div>
        {% endif %}
        <button type="submit">Sign in</button>
      </form>
      {% if next == "/rf-map/" %}
        <p><a href="{% url 'guest_rf_map' %}">Continue as guest</a></p>
      {% endif %}
    </main>
  </body>
</html>
